name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    name: skills validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Format check
        run: npm run format:check
      - name: Generated index in sync
        run: npm run check:index
      - name: Vendored humanizer region
        run: npm run check:humanizer
      - name: Full skill + marketplace validate
        run: npm test
      - name: Plain-Vite SSR smoke test
        run: npm run test:plain-ssr
