# Copy to .github/workflows/design-lock.yml (`designlock.py init` does it) and make the job `design-ok` a REQUIRED check
# (Settings > Rules > Rulesets or branch protection). GitHub counts a skipped job as passing, so design-ok fails unless both jobs succeed.
#
# pull_request_target makes GitHub run this file and the tooling (designlock.py, guard.py) from the base branch, so a pull request cannot edit
# the gate that judges it. The pull request is checked out into pr/ and measured. The capture command builds and runs the PR's own code, so PR code
# does execute on this runner, with a read-only token and without any secret. Base tooling then fails the gate if capture changed a frame, the config, or
# a locked file, and re-validates the measured output. A PR can still misreport its own rendering, so I review the capture script (a locked path)
# and the report. Branch protection, the required check, and the label permission stay out of the agent's reach.
# Pin the action SHAs the way your repo does (these are v4.2.2 / v4.6.2).
name: design-lock
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, master]
# A label other than the approval label reruns nothing: those events get their own concurrency group so they cannot cancel a real run.
concurrency:
  group: design-lock-${{ github.event.pull_request.number || github.ref }}-${{ ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'design:approved-change') && 'other-label' || 'main' }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gate:
    if: (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'design:approved-change'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trusted tooling (base commit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}", path: base, persist-credentials: false}
      - name: Code under test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}", path: pr, fetch-depth: 0, persist-credentials: false}
      # Install what the capture command needs, with versions PINNED so frames and measurements come from the same renderer:
      #   web:     pip install playwright==<version> && playwright install --with-deps chromium  (plus the fonts your design uses)
      #   android: actions/setup-java, android-actions/setup-android, reactivecircus/android-emulator-runner
      #   ios:     runs-on: macos-latest, boot a simulator with the frame's device and appearance
      #   flutter: subosito/flutter-action
      - name: Design gate (compare engine from the base commit)
        working-directory: pr
        run: python3 ../base/tools/design-lock/designlock.py gate --root .
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: design-lock-report, path: pr/build/design-lock, if-no-files-found: warn}
  guard:
    runs-on: ubuntu-latest
    needs: gate
    if: always() && github.event_name == 'pull_request_target' && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'design:approved-change')
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ github.event.pull_request.base.sha }}", path: base, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {ref: "${{ github.event.pull_request.head.sha }}", path: pr, fetch-depth: 0, persist-credentials: false}
      - name: An approval covers one commit, so a new push drops the label
        if: github.event.action == 'synchronize'
        env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}", PR: "${{ github.event.pull_request.number }}"}
        run: gh pr edit "$PR" --remove-label "design:approved-change" || true
      - name: Guard frames, tolerances, baseline, goldens (guard.py from the base commit)
        working-directory: pr
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GATE_RESULT: ${{ needs.gate.result }}
        run: python3 ../base/tools/design-lock/guard.py
  design-ok:
    if: always() && ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'design:approved-change')
    needs: [gate, guard]
    runs-on: ubuntu-latest
    steps:
      - env:
          GATE: ${{ needs.gate.result }}
          GUARD: ${{ needs.guard.result }}
          EVENT: ${{ github.event_name }}
        run: |
          [ "$GATE" = success ] || { echo "design gate: $GATE"; exit 1; }
          [ "$EVENT" != pull_request_target ] || [ "$GUARD" = success ] || { echo "design guard: $GUARD"; exit 1; }
